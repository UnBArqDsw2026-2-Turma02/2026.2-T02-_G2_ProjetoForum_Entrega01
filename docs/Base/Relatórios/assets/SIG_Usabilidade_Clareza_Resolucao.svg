<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1220" viewBox="0 0 1500 1220" role="img" aria-labelledby="title desc">
  <title id="title">SIG/NFR de Usabilidade: clareza e previsibilidade da resolução</title>
  <desc id="desc">Softgoal de Usabilidade com decomposição AND, indicada pelo operador gráfico ∧, em compreensão da interação, visibilidade do estado e feedback e orientação, com operacionalizações relacionadas aos achados da Engenharia Reversa.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#25344d"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: Arial, sans-serif; font-size: 17px; fill: #43516a; }
      .softgoal { fill: #ffffff; stroke: #25344d; stroke-width: 2.2; filter: url(#shadow); }
      .softgoal-title { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .softgoal-text { font-family: Arial, sans-serif; font-size: 14px; fill: #43516a; text-anchor: middle; }
      .operation { fill: #f8fbff; stroke: #25344d; stroke-width: 2; filter: url(#shadow); }
      .operation-text { font-family: Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #172033; text-anchor: middle; }
      .relation { stroke: #25344d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .decomposition { stroke: #25344d; stroke-width: 2; fill: none; }
      .relation-label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .and-operator { fill: #ffffff; stroke: #25344d; stroke-width: 2; }
      .and-symbol { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .note { fill: #f4f6fa; stroke: #9aa8bc; stroke-width: 1.5; }
      .note-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #172033; }
      .note-text { font-family: Arial, sans-serif; font-size: 14px; fill: #43516a; }
      .base { fill: #ffffff; stroke: #9aa8bc; stroke-width: 1.5; }
      .base-title { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #172033; }
      .base-text { font-family: Arial, sans-serif; font-size: 14px; fill: #43516a; }
      .legend { font-family: Arial, sans-serif; font-size: 14px; fill: #43516a; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1500" height="1220" fill="#ffffff"/>

  <text x="750" y="38" class="title" text-anchor="middle">SIG/NFR complementar</text>
  <text x="750" y="64" class="subtitle" text-anchor="middle">Usabilidade — clareza e previsibilidade do estado da pergunta e da resolução</text>

  <!-- Softgoal principal -->
  <g transform="translate(0,60)">
    <path class="softgoal" d="M 550 92 C 505 66 520 25 580 25 C 615 -5 680 7 700 38 C 750 2 825 8 842 45 C 900 20 965 48 950 88 C 1005 102 1000 155 952 166 C 950 213 880 227 840 199 C 800 232 730 222 713 190 C 660 218 595 201 600 163 C 548 160 522 119 550 92 Z"/>
    <text x="750" y="101" class="softgoal-title">Usabilidade</text>
    <text x="750" y="128" class="softgoal-text">clareza e previsibilidade</text>
    <text x="750" y="149" class="softgoal-text">do estado da pergunta e da resolução</text>
  </g>

  <!-- Decomposição do softgoal -->
  <path class="decomposition" d="M 750 292 L 750 295"/>
  <path class="decomposition" d="M 733 312 L 275 385"/>
  <path class="decomposition" d="M 750 329 L 750 385"/>
  <path class="decomposition" d="M 767 312 L 1225 385"/>
  <g aria-label="Decomposição AND">
    <title>Decomposição AND</title>
    <circle cx="750" cy="312" r="17" class="and-operator"/>
    <text x="750" y="320" class="and-symbol">∧</text>
  </g>

  <!-- Softgoals intermediários -->
  <g transform="translate(0,70)">
    <path class="softgoal" d="M 105 344 C 70 325 82 292 125 292 C 145 262 198 268 215 294 C 250 270 300 279 310 310 C 354 296 390 324 378 354 C 420 366 414 404 378 414 C 375 450 323 462 292 441 C 258 466 210 458 199 432 C 157 453 112 431 116 403 C 78 401 70 365 105 344 Z"/>
    <text x="250" y="353" class="softgoal-title">Compreensão da interação</text>
    <text x="250" y="378" class="softgoal-text">usuários distinguem papéis,</text>
    <text x="250" y="398" class="softgoal-text">ações e significados</text>
  </g>

  <g transform="translate(0,70)">
    <path class="softgoal" d="M 580 344 C 545 325 557 292 600 292 C 620 262 673 268 690 294 C 725 270 775 279 785 310 C 829 296 865 324 853 354 C 895 366 889 404 853 414 C 850 450 798 462 767 441 C 733 466 685 458 674 432 C 632 453 587 431 591 403 C 553 401 545 365 580 344 Z"/>
    <text x="725" y="353" class="softgoal-title">Visibilidade do estado</text>
    <text x="725" y="378" class="softgoal-text">o usuário entende o momento</text>
    <text x="725" y="398" class="softgoal-text">e o próximo caminho</text>
  </g>

  <g transform="translate(0,70)">
    <path class="softgoal" d="M 1055 344 C 1020 325 1032 292 1075 292 C 1095 262 1148 268 1165 294 C 1200 270 1250 279 1260 310 C 1304 296 1340 324 1328 354 C 1370 366 1364 404 1328 414 C 1325 450 1273 462 1242 441 C 1208 466 1160 458 1149 432 C 1107 453 1062 431 1066 403 C 1028 401 1020 365 1055 344 Z"/>
    <text x="1200" y="353" class="softgoal-title">Feedback e orientação</text>
    <text x="1200" y="378" class="softgoal-text">o sistema orienta ações</text>
    <text x="1200" y="398" class="softgoal-text">e comunica seus efeitos</text>
  </g>

  <!-- Operacionalizações -->
  <rect class="operation" x="30" y="625" width="220" height="150" rx="14"/>
  <text x="140" y="677" class="operation-text">
    <tspan x="140" dy="0">Diferenciar resposta,</tspan>
    <tspan x="140" dy="23">comentário e voto</tspan>
  </text>

  <rect class="operation" x="270" y="625" width="220" height="150" rx="14"/>
  <text x="380" y="677" class="operation-text">
    <tspan x="380" dy="0">Destacar aceitação</tspan>
    <tspan x="380" dy="23">e resolução pessoal</tspan>
  </text>

  <rect class="operation" x="510" y="625" width="220" height="150" rx="14"/>
  <text x="620" y="677" class="operation-text">
    <tspan x="620" dy="0">Exibir estado da pergunta</tspan>
    <tspan x="620" dy="23">aberta, sem resposta,</tspan>
    <tspan x="620" dy="23">resolvida ou fechada</tspan>
  </text>

  <rect class="operation" x="750" y="625" width="220" height="150" rx="14"/>
  <text x="860" y="677" class="operation-text">
    <tspan x="860" dy="0">Indicar continuidade</tspan>
    <tspan x="860" dy="23">e possibilidade</tspan>
    <tspan x="860" dy="23">de reabertura</tspan>
  </text>

  <rect class="operation" x="990" y="625" width="220" height="150" rx="14"/>
  <text x="1100" y="677" class="operation-text">
    <tspan x="1100" dy="0">Validar campos</tspan>
    <tspan x="1100" dy="23">e orientar a publicação</tspan>
  </text>

  <rect class="operation" x="1230" y="625" width="220" height="150" rx="14"/>
  <text x="1340" y="677" class="operation-text">
    <tspan x="1340" dy="0">Informar resultado</tspan>
    <tspan x="1340" dy="23">das ações e orientar</tspan>
    <tspan x="1340" dy="23">os próximos passos</tspan>
  </text>

  <!-- Contribuições das operacionalizações -->
  <path class="relation" d="M 140 625 L 185 522"/>
  <text x="159" y="550" class="relation-label">++</text>

  <path class="relation" d="M 380 625 L 315 522"/>
  <text x="349" y="550" class="relation-label">++</text>

  <path class="relation" d="M 620 625 L 665 522"/>
  <text x="642" y="550" class="relation-label">++</text>

  <path class="relation" d="M 860 625 L 785 522"/>
  <text x="827" y="550" class="relation-label">+</text>

  <path class="relation" d="M 1100 625 L 1145 522"/>
  <text x="1122" y="550" class="relation-label">+</text>

  <path class="relation" d="M 1340 625 L 1275 522"/>
  <text x="1304" y="550" class="relation-label">+</text>

  <!-- Trade-off -->
  <rect class="note" x="280" y="855" width="940" height="105" rx="14"/>
  <text x="320" y="895" class="note-title">Trade-off principal</text>
  <text x="320" y="922" class="note-text">Validações, distinções e estados explícitos aumentam a clareza e a previsibilidade,</text>
  <text x="320" y="944" class="note-text">mas podem elevar a fricção inicial da participação; o feedback deve tornar esse custo compreensível.</text>

  <!-- Base de rastreabilidade conceitual -->
  <rect class="base" x="170" y="1000" width="1160" height="78" rx="12"/>
  <text x="195" y="1028" class="base-title">Base da representação</text>
  <text x="195" y="1053" class="base-text">ER-C01 publicação da pergunta • ER-C02 resposta e avaliação • ER-C03 aceitação como resolução pessoal • ER-C04 continuidade</text>

  <text x="750" y="1130" class="legend">NFR: ++ MAKE (contribuição forte) • + HELP (contribuição positiva) • - HURT (contribuição negativa) • ∧ AND (decomposição conjunta)</text>
  <text x="750" y="1170" class="legend">SIG/NFR de Usabilidade — artefato complementar do G2_ProjetoForum</text>
</svg>
